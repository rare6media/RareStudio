<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RareStudio overlay</title>
<!--
  RareStudio scene overlay: Starting soon, Be right back, Stream ending, Countdown.
  Driven by the address it is opened with:
    overlay.html?mode=starting|brb|ending|countdown
                &title=...&sub=...&chip=STANDBY&minutes=5&at=20:00&done=We%20are%20live
                &c1=8b5cf6&c2=ec4899&logo=0
  minutes counts down from when the scene goes on air; at= counts down to a clock time instead.
  c1/c2 are the two accent colours (hex, no #); logo=0 hides the logo; chip is the small status label.
  RareStudio rewrites this file on every start; make a copy to customise it.
-->
<style>
  :root { --a1: #8b5cf6; --a2: #ec4899; --base: #111117; }
  body.brb       { --a1: #f59e0b; --a2: #f43f5e; }
  body.ending    { --a1: #34d399; --a2: #38bdf8; }
  body.countdown { --a1: #8b5cf6; --a2: #22d3ee; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--base);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: #ececf4; }

  /* Faint grid and a soft vignette: a control room, not a screensaver. */
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 6vmin 6vmin; -webkit-mask-image: radial-gradient(ellipse at 50% 45%, #000 0%, transparent 72%); }
  .glow { position: absolute; left: 50%; top: 40%; width: 80vmin; height: 80vmin; margin: -40vmin 0 0 -40vmin; border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--a1) 28%, transparent), transparent 65%); }

  .stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

  /* The logo transmits: rings leave it one after another. */
  .tx { position: relative; width: 16vmin; height: 16vmin; margin-bottom: 5vmin; }
  .ring { position: absolute; left: 50%; top: 50%; width: 16vmin; height: 16vmin; margin: -8vmin 0 0 -8vmin; border-radius: 50%;
    border: .35vmin solid var(--a1); opacity: 0; animation: ping 4s cubic-bezier(.15,.6,.3,1) infinite; }
  .ring:nth-child(2) { animation-delay: 1s; border-color: color-mix(in srgb, var(--a1) 50%, var(--a2)); }
  .ring:nth-child(3) { animation-delay: 2s; border-color: color-mix(in srgb, var(--a1) 20%, var(--a2)); }
  .ring:nth-child(4) { animation-delay: 3s; border-color: var(--a2); }
  @keyframes ping { 0% { transform: scale(.9); opacity: .0; } 10% { opacity: .55; } 100% { transform: scale(4.6); opacity: 0; } }
  .logo { position: relative; width: 100%; height: 100%; border-radius: 3.4vmin; box-shadow: 0 0 5vmin color-mix(in srgb, var(--a1) 55%, transparent);
    animation: float 6s ease-in-out infinite alternate; }
  @keyframes float { to { transform: translateY(-1vmin); } }
  body.nologo .tx { display: none; }

  .chip, h1, .sub, .timer { position: relative; z-index: 2; }
  .chip { display: inline-flex; align-items: center; gap: 1.2vmin; padding: .9vmin 2.2vmin; border-radius: 99px;
    border: 1px solid color-mix(in srgb, var(--a1) 55%, transparent); background: color-mix(in srgb, var(--a1) 14%, transparent);
    font: 600 2vmin/1 "Cascadia Mono", Consolas, monospace; letter-spacing: .5vmin; color: color-mix(in srgb, var(--a1) 40%, #fff); margin-bottom: 3vmin; }
  .chip i { width: 1.3vmin; height: 1.3vmin; border-radius: 50%; background: var(--a2); animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .chip:empty { display: none; }

  h1 { margin: 0; font-size: 9.5vmin; font-weight: 700; letter-spacing: 1vmin; }
  h1 span { display: inline-block; animation: rise .7s cubic-bezier(.2,.8,.2,1) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(2vmin); } }
  .sub { margin-top: 2.2vmin; font-size: 3.2vmin; letter-spacing: .4vmin; color: #9a9ab0; min-height: 4vmin; }
  .timer { margin-top: 5vmin; font-size: 15vmin; font-weight: 300; letter-spacing: 1vmin; font-variant-numeric: tabular-nums;
    background: linear-gradient(90deg, var(--a1), var(--a2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .timer.done { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .timer:empty { display: none; }
  .bar { position: absolute; left: 0; bottom: 0; height: .9vmin; width: 100%; background: linear-gradient(90deg, var(--a1), var(--a2)); transform-origin: left; transform: scaleX(0); }
  .track { position: absolute; left: 0; bottom: 0; height: .9vmin; width: 100%; background: rgba(255,255,255,.06); }
</style>
</head>
<body>
<div class="grid"></div><div class="glow"></div>
<div class="stage">
  <div class="tx"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div>
    <img class="logo" src="logo.png" alt="" onerror="document.body.classList.add('nologo')"></div>
  <div class="chip" id="chip"></div>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div class="timer" id="timer"></div>
</div>
<div class="track"></div><div class="bar" id="bar"></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var mode = q.get('mode') || 'starting';
  var presets = {
    starting:  { title: 'STARTING SOON',        sub: 'Grab a drink, we go live in a moment', done: 'WE ARE LIVE', chip: 'STANDBY' },
    brb:       { title: 'BE RIGHT BACK',        sub: 'Stay with us', done: 'BACK ANY SECOND', chip: 'PAUSED' },
    ending:    { title: 'THANKS FOR WATCHING',  sub: 'Stream ending. See you next time', done: '', chip: 'SIGNING OFF' },
    countdown: { title: 'COMING UP',            sub: '', done: 'GO TIME', chip: 'UP NEXT' }
  };
  var p = presets[mode] || presets.starting;
  document.body.className = mode;
  function hex(v) { return /^[0-9a-f]{3}([0-9a-f]{3})?$/i.test(v || '') ? '#' + v : null; }
  if (hex(q.get('c1'))) document.documentElement.style.setProperty('--a1', hex(q.get('c1')));
  if (hex(q.get('c2'))) document.documentElement.style.setProperty('--a2', hex(q.get('c2')));
  if (q.get('logo') === '0') document.body.classList.add('nologo');

  var title = q.has('title') ? q.get('title') : p.title;
  var sub = q.has('sub') ? q.get('sub') : p.sub;
  var done = q.has('done') ? q.get('done') : p.done;
  var chip = q.has('chip') ? q.get('chip') : p.chip;
  var minutes = parseFloat(q.get('minutes') || '0') || 0;
  var at = q.get('at');

  var h1 = document.getElementById('title');
  Array.from(title).forEach(function (ch, i) {
    var s = document.createElement('span');
    if (ch === ' ') s.innerHTML = '&nbsp;'; else s.textContent = ch;
    s.style.animationDelay = (0.15 + i * 0.04) + 's';
    h1.appendChild(s);
  });
  document.getElementById('sub').textContent = sub;
  if (chip) document.getElementById('chip').innerHTML = '<i></i>' + chip.replace(/[<&]/g, ' ');

  var timer = document.getElementById('timer'), bar = document.getElementById('bar');
  var target = 0, span = 0;
  function start() {
    var now = Date.now();
    if (at && /^\d{1,2}:\d{2}$/.test(at)) {
      var hm = at.split(':'), t = new Date();
      t.setHours(+hm[0], +hm[1], 0, 0);
      if (t.getTime() < now - 12 * 3600e3) t = new Date(t.getTime() + 24 * 3600e3); // tomorrow's, unless it just passed
      target = t.getTime(); span = Math.max(1, target - now);
    } else if (minutes > 0) {
      target = now + minutes * 60e3; span = minutes * 60e3;
    } else { target = 0; }
    timer.className = 'timer';
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function tick() {
    if (!target) { timer.textContent = ''; bar.style.transform = 'scaleX(0)'; return; }
    var left = target - Date.now();
    if (left <= 0) {
      timer.textContent = done; timer.className = 'timer done'; bar.style.transform = 'scaleX(1)'; return;
    }
    var s = Math.ceil(left / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
    timer.textContent = (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(s % 60);
    bar.style.transform = 'scaleX(' + (1 - left / span) + ')';
  }
  start();
  setInterval(tick, 250);
  tick();
  // RareStudio tells the page when its scene goes on air: a "5 minutes" countdown starts then.
  window.addEventListener('rarestudio-live', function () { start(); tick(); });
})();
</script>
</body>
</html>
